<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="/warzone/ui/towers-shell.css"><link rel="stylesheet" href="/warzone/ui/towers-monochrome.css"><link rel="stylesheet" href="/warzone/ui/towers-game-controls.css">
<style>@font-face{font-family:Towers;src:url(Oswald.ttf);font-weight:200 700;font-display:swap}html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;overflow:hidden;background:black;overscroll-behavior:none}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#blocknight-research-shell{z-index:160}</style></head>
<body class="wt-towers-polished"><canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<script>var Module={},LaunchedModule=null;var PcMultiplayerState={phase:'loading',nativeMenuOpen:false,worldReady:false};window.__warzoneMultiplayerMode=true;</script>
<script src="/warzone/music-catalog.js"></script><script src="music.js"></script>
<script src="socket-bridge.js"></script><script src="lobby-http.js"></script><script src="lobby-config.js"></script><script src="mobile-controls.js"></script>
<script src="native-ui-adapter.js"></script><script src="/warzone/ui/research-art.js"></script><script src="terrain.js"></script><script src="/warzone-command-pages.js"></script><script src="/warzone-mobile-research.js"></script>
<script src="intelligence.js"></script>
<script src="warzone2100.js"></script>
<script>
function wz_js_get_config_dir_path(){return '/warzone2100-online';}
function wz_js_get_maximum_memory_mib(){return 2048;}
function wz_js_display_canvas(){}
function wz_js_display_loading_indicator(on){parent.PcMultiplayerSession.loading(Boolean(on));}
function wz_js_display_saving_indicator(){}
function wz_js_save_config_dir_to_persistent_storage(user,callback){LaunchedModule?.wzSaveConfigDirToPersistentStore(error=>{if(error)nativeMessage('Could not save multiplayer settings: '+error);callback?.();});}
function wz_js_handle_app_exit(){parent.PcMultiplayerSession.requestReturn('Game closed.');}
function nativeMessage(message){parent.PcMultiplayerSession.message(String(message));console.warn(message);}
async function boot(){
 try{await window.PcMultiplayerNativeUI?.prepare?.();}catch(error){nativeMessage(error?.stack||String(error));parent.PcMultiplayerSession.failed('The multiplayer interface could not load.');return;}
 const canvas=document.getElementById('canvas');canvas.width=innerWidth;canvas.height=innerHeight;
 Module={canvas,arguments:[...parent.PcMultiplayerSession.arguments,'--configdir='+wz_js_get_config_dir_path(),'--debug=net','--debug=info','--debug=warning','--flush-debug-stderr'],locateFile:p=>p,print:s=>console.log(s),printErr:nativeMessage,
  setStatus:s=>parent.PcMultiplayerSession.status(s),onRuntimeInitialized:()=>{PcLobbyConfig.apply(Module.FS,wz_js_get_config_dir_path(),parent.PcMultiplayerSession.playerName());window.PcMultiplayerNativeUI?.initialize?.(Module);},onAbort:s=>nativeMessage('Engine error: '+s)};
 try{LaunchedModule=await createWZModule(Module);window.PcMultiplayerNativeUI?.attach?.(LaunchedModule);PcMultiplayerControls.enable();parent.PcMultiplayerSession.engineReady();canvas.focus();}catch(error){nativeMessage(error?.stack||String(error));parent.PcMultiplayerSession.failed('The game could not start.');}
}
window.addEventListener('error',event=>nativeMessage(event.error?.stack||event.message));window.addEventListener('unhandledrejection',event=>nativeMessage(event.reason?.stack||String(event.reason)));
boot();
</script></body></html>
