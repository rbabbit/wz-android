<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Multiplayer</title>
<link rel="stylesheet" href="/warzone/ui/towers-shell.css"><link rel="stylesheet" href="/warzone/ui/towers-monochrome.css"><link rel="stylesheet" href="/warzone/ui/towers-game-controls.css"><link rel="stylesheet" href="multiplayer.css"></head>
<body class="mp-shell wt-towers-polished">
<main id="setup">
 <header class="lobby-heading"><h1>Multiplayer</h1><div class="lobby-namefield"><label for="player-name">Player name</label><input id="player-name" autocomplete="nickname" autocapitalize="off" spellcheck="false" aria-describedby="profile-status"></div><div class="lobby-tools"><label class="lobby-toggle" for="hide-empty"><span>Hide empty</span><input id="hide-empty" type="checkbox"><span class="lobby-toggle-track" aria-hidden="true"><span></span></span></label><button id="lobby" type="button">Refresh</button></div></header>
 <span id="profile-status" role="status" aria-live="polite"></span>
 <p id="notice" role="status" hidden></p>
 <section class="lobby-list-wrap" aria-label="Public multiplayer rooms"><div class="lobby-column-head"><span>ROOM <span id="lobby-status" role="status" aria-live="polite">Loading…</span></span><span>MAP</span><span>PLAYERS</span><span></span></div><div id="rooms" role="list" tabindex="0" aria-label="Public multiplayer rooms"></div></section>
 <details class="lobby-direct"><summary>Join by IP address</summary><div class="direct"><input id="address" placeholder="PC IP:2100" aria-label="PC host address" autocomplete="off" autocapitalize="off"><button id="direct-join">Join</button></div></details>
</main>
<div id="engine-host" hidden></div>
<header id="warzone-command-strip" hidden><nav id="game-controls" aria-label="Multiplayer commands"><div id="blocknight-combat-hud"><div class="bn-command-group">
 <button id="blocknight-tech" data-command="research" aria-expanded="false"><img src="/warzone/ui/icons/flask.svg" alt=""> RESEARCH</button><button id="wt-open-factory" data-command="manufacturing" aria-expanded="false">MANUFACTURING</button><button id="wt-open-queue" data-command="queue" aria-expanded="false">QUEUE</button><button id="blocknight-base" data-command="base"><img src="/warzone/ui/icons/house.svg" alt=""> BASE</button><button id="blocknight-combat" data-command="combat" aria-pressed="false"><img src="/warzone/ui/icons/stack.svg" alt=""> ALL COMBAT</button>
 <button id="blocknight-music" data-command="music" aria-expanded="false"><img src="/warzone/ui/icons/music-notes.svg" alt=""> MUSIC</button>
 </div><div id="mp-header-status" hidden aria-label="Game status"><span id="mp-native-timer" hidden role="timer" aria-live="off"></span><span id="mp-native-connection" hidden role="status" aria-live="polite"></span></div><button id="leave" class="dark">LOBBY</button></div></nav></header>
<div id="unit-controls" hidden><button id="wt-field-toggle" type="button" aria-label="Unit controls" aria-controls="wt-field-centre" aria-expanded="false"><img src="/warzone/ui/icons/stack.svg" alt=""></button><section id="wt-field-centre" hidden aria-label="Unit controls">
 <button data-command="all-units"><img src="/warzone/ui/icons/stack.svg" alt=""><span>ALL UNITS</span></button><button data-command="deselect"><img src="/warzone/ui/icons/deselect.svg" alt=""><span>DESELECT</span></button><button data-command="stop"><img src="/warzone/ui/icons/hand-palm.svg" alt=""><span>STOP</span></button><button data-command="trucks"><img src="/warzone/ui/icons/stack-plus.svg" alt=""><span>TRUCKS</span></button><button data-command="demolish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-3 3-2-2-9 9-3-3 9-9-2-2z"/></svg><span>DEMOLISH</span></button><button data-command="intelligence"><img src="/warzone/ui/icons/question.svg" alt=""><span>INTELLIGENCE</span></button>
</section></div>
<div id="mp-power-hud" hidden role="img" aria-label="Power"><span id="mp-power-value"></span><span id="mp-power-track" aria-hidden="true"><i id="mp-power-available"></i><i id="mp-power-reserved"></i></span></div>
<button id="room-leave" class="dark" hidden>‹ Lobby</button>
<section id="loading-cover" hidden aria-label="Loading multiplayer" aria-live="polite"><div><span class="loading-spinner" aria-hidden="true"></span><h2 id="loading-title">Joining game</h2><p id="loading-detail">Connecting to the room…</p><button id="cancel-join" class="dark">CANCEL</button></div></section>
<div id="transition" hidden role="status">Returning to lobby…</div><div id="mp-toast" hidden role="status"></div>
<script src="socket-bridge.js"></script><script src="lobby-http.js"></script><script src="lobby-config.js"></script><script src="session.js"></script><script src="lobby-ui.js"></script>
</body></html>
