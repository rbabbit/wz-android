<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Multiplayer</title>
<link rel="stylesheet" href="/warzone/ui/towers-shell.css"><link rel="stylesheet" href="/warzone/ui/towers-monochrome.css"><link rel="stylesheet" href="/warzone/ui/towers-game-controls.css"><link rel="stylesheet" href="multiplayer.css"><link rel="stylesheet" href="room-ui.css"></head>
<body class="mp-shell wt-towers-polished">
<main id="setup">
 <header class="lobby-heading"><h1>Multiplayer</h1><div class="lobby-namefield"><label for="player-name">Player name</label><div class="lobby-name-control"><input id="player-name" maxlength="24" autocomplete="nickname" autocapitalize="off" spellcheck="false" aria-describedby="player-name-suffix profile-status"><span id="player-name-suffix" contenteditable="false">(m)</span></div></div><div class="lobby-tools"><label class="lobby-toggle" for="hide-empty"><span>Hide empty</span><input id="hide-empty" type="checkbox"><span class="lobby-toggle-track" aria-hidden="true"><span></span></span></label><button id="lobby" type="button">Refresh</button></div></header>
 <span id="profile-status" role="status" aria-live="polite"></span>
 <p id="notice" role="status" hidden></p>
 <section class="lobby-list-wrap" aria-label="Public multiplayer rooms"><div class="lobby-column-head"><span>ROOM <span id="lobby-status" role="status" aria-live="polite">Loading…</span></span><span>MAP</span><span>PLAYERS</span><span></span></div><div id="rooms" role="list" tabindex="0" aria-label="Public multiplayer rooms"></div></section>
 <details class="lobby-direct"><summary>Join by IP address</summary><div class="direct"><input id="address" placeholder="PC IP:2100" aria-label="PC host address" autocomplete="off" autocapitalize="off"><button id="direct-join">Join</button></div></details>
</main>
<div id="engine-host" hidden></div>
<main id="mp-room" hidden aria-hidden="true" aria-label="Multiplayer waiting room">
 <header class="mp-room-header"><button id="room-leave" type="button" class="dark">LEAVE</button><div class="mp-room-title"><h1 id="mp-room-title">Multiplayer room</h1><span id="mp-room-map" class="mp-room-map"></span></div><button id="mp-room-map-toggle" type="button" aria-expanded="false" aria-controls="mp-room-map-preview">MAP</button><div class="mp-room-counts"><span id="mp-room-counts"></span><span id="mp-room-spectators"></span></div></header>
 <div class="mp-room-content"><section class="mp-room-roster" aria-label="Room players"><div class="mp-room-heading"><h2>Players <span id="mp-room-roster-count"></span></h2><small>Team</small></div><div id="mp-room-players" class="mp-room-players" tabindex="0"></div></section><section class="mp-room-chat" aria-label="Room chat"><div class="mp-room-heading"><h2>Chat</h2></div><div id="mp-room-chat-log" class="mp-room-chat-log" role="log" aria-live="polite" aria-relevant="additions text" tabindex="0"></div><form id="mp-room-composer" class="mp-room-composer"><input id="mp-room-chat-input" type="text" maxlength="256" aria-label="Chat message" placeholder="Message the room…" autocomplete="off" enterkeyhint="send"><button id="mp-room-chat-send" type="submit">SEND</button></form></section></div>
 <footer class="mp-room-footer"><span id="mp-room-self" class="mp-room-self"></span><label class="mp-room-my-team">Your team<select id="mp-room-team" aria-label="Your team"></select></label><button id="mp-room-spectate" type="button" aria-pressed="false">SPECTATE</button><button id="mp-room-options-toggle" type="button" aria-expanded="false" aria-controls="mp-room-options">MATCH OPTIONS</button><span id="mp-room-ready-note" class="mp-room-note" role="status"></span><button id="mp-room-ready" type="button" class="room-primary" aria-pressed="false">READY</button><p id="mp-room-feedback" role="status" aria-live="polite"></p></footer>
 <aside id="mp-room-options" class="mp-room-options" hidden aria-label="Match options"><header><h2>Match options</h2><button id="mp-room-options-close" type="button">CLOSE</button></header><dl id="mp-room-options-list"></dl></aside>
 <aside id="mp-room-map-preview" class="mp-room-map-preview" hidden aria-label="Map preview"><header><h2 id="mp-room-preview-name"></h2><button id="mp-room-map-close" type="button">CLOSE</button></header><p id="mp-room-map-status" role="status"></p><canvas id="mp-room-map-canvas" hidden aria-label="Actual multiplayer map preview"></canvas></aside>
</main>
<header id="warzone-command-strip" hidden><nav id="game-controls" aria-label="Multiplayer commands"><div id="blocknight-combat-hud"><div class="bn-command-group">
 <button id="blocknight-tech" data-command="research" aria-expanded="false"><img src="/warzone/ui/icons/flask.svg" alt=""> RESEARCH</button><button id="wt-open-factory" data-command="manufacturing" aria-expanded="false">MANUFACTURING</button><button id="wt-open-queue" data-command="queue" aria-expanded="false">QUEUE</button><button id="blocknight-base" data-command="base"><img src="/warzone/ui/icons/house.svg" alt=""> BASE</button><button id="blocknight-combat" data-command="combat" aria-pressed="false"><img src="/warzone/ui/icons/stack.svg" alt=""> ALL COMBAT</button>
 <button id="blocknight-repair" data-command="repair" aria-pressed="false" aria-busy="false" data-repair-enabled="false" title="Enable automatic repair retreat at 75% health for all your combat units and new production"><img src="/warzone/ui/icons/wrench.svg" alt=""> REPAIR</button>
 <button id="wt-open-players" data-command="players" aria-expanded="false">PLAYERS</button>
 <button id="blocknight-music" data-command="music" aria-expanded="false"><img src="/warzone/ui/icons/music-notes.svg" alt=""> MUSIC</button>
 <button id="leave" class="dark">LOBBY</button>
 </div><div id="mp-header-status" hidden aria-label="Game status"><span id="mp-native-timer" hidden role="timer" aria-live="off"></span><span id="mp-native-connection" hidden role="status" aria-live="polite"></span></div></div></nav></header>
<div id="unit-controls" hidden><button id="wt-field-toggle" type="button" aria-label="Unit controls" aria-controls="wt-field-centre" aria-expanded="false"><img src="/warzone/ui/icons/stack.svg" alt=""></button><section id="wt-field-centre" hidden aria-label="Unit controls">
 <button data-command="all-units"><img src="/warzone/ui/icons/stack.svg" alt=""><span>ALL UNITS</span></button><button data-command="deselect"><img src="/warzone/ui/icons/deselect.svg" alt=""><span>DESELECT</span></button><button data-command="stop"><img src="/warzone/ui/icons/hand-palm.svg" alt=""><span>STOP</span></button><button data-command="trucks"><img src="/warzone/ui/icons/stack-plus.svg" alt=""><span>TRUCKS</span></button><button data-command="demolish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6-3 3-2-2-9 9-3-3 9-9-2-2z"/></svg><span>DEMOLISH</span></button><button data-command="intelligence"><img src="/warzone/ui/icons/question.svg" alt=""><span>INTELLIGENCE</span></button>
</section></div>
<div id="mp-power-hud" hidden role="img" aria-label="Power"><span id="mp-power-value"></span><span id="mp-power-track" aria-hidden="true"><i id="mp-power-available"></i><i id="mp-power-reserved"></i></span></div>
<section id="loading-cover" hidden aria-label="Loading multiplayer" aria-live="polite"><div><span class="loading-spinner" aria-hidden="true"></span><h2 id="loading-title">Joining game</h2><p id="loading-detail">Connecting to the room…</p><button id="cancel-join" class="dark">CANCEL</button></div></section>
<div id="transition" hidden role="status">Returning to lobby…</div><div id="mp-toast" hidden role="status"></div>
<script src="socket-bridge.js"></script><script src="lobby-http.js"></script><script src="lobby-config.js"></script><script src="room-ui.js"></script><script src="session.js"></script><script src="native-landing.js"></script><script src="lobby-ui.js"></script>
</body></html>
